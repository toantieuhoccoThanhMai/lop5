<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuối học kì II</title><style>
:root{--main:#d9632b;--dark:#8a3a14;--soft:#fff4ec;--ok:#2e9e5b;--bad:#d9534f;--ink:#26323f}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--soft);color:var(--ink);line-height:1.5;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
.hero{position:relative;margin:0 -14px;overflow:hidden;background:#9bd5f5}
.hero svg{display:block;width:100%;height:auto;max-height:230px}
.hero-title{position:absolute;left:0;right:0;top:8%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:rgba(255,255,255,.9);color:var(--dark);font-weight:800;font-size:13px;padding:2px 12px;border-radius:99px}
.hero-title h1{margin:6px 0 0;font-size:clamp(26px,7.4vw,46px);line-height:1.12;color:#fff;text-shadow:0 3px 0 var(--dark),0 6px 14px rgba(0,0,0,.25)}
.cloud{animation:drift 30s linear infinite alternate}.c2{animation-duration:38s}
@keyframes drift{to{transform:translateX(40px)}}
.swirl{stroke-dasharray:14 10;animation:blow 3.5s linear infinite}
@keyframes blow{to{stroke-dashoffset:-96}}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translate(8px,-10px) rotate(4deg)}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
.drive{animation:drive 9s linear infinite}
@keyframes drive{from{transform:translateX(-80px)}to{transform:translateX(930px)}}
@media (prefers-reduced-motion:reduce){.swirl,.cloud,.fly,.sway,.drive{animation:none}}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.info label{display:block;font-weight:700;font-size:14px;margin:8px 0 4px;color:var(--dark)}
.info input,.info select{width:100%;font-size:17px;padding:10px 12px;border:2px solid #cfd8e3;border-radius:10px;background:#fff}
.info input[readonly]{background:#eef3f8}
.bar{position:sticky;top:0;z-index:5;background:var(--soft);padding:8px 0 6px;display:flex;align-items:center;gap:10px}
.bar .pb{flex:1;height:12px;background:#dbe5ee;border-radius:99px;overflow:hidden}.bar .pb i{display:block;height:100%;width:0;background:var(--main);transition:width .3s}
.bar .pt{font-size:13px;font-weight:700;color:var(--dark);min-width:52px;text-align:right}
.snd{border:0;background:#fff;border-radius:99px;width:38px;height:38px;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer}
.section-h{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
.section-h .ico{flex:none}.section-h h2{margin:0;font-size:21px;color:var(--dark)}
.stem{font-weight:600;margin:0 0 8px}
.lab{display:inline-block;background:var(--main);color:#fff;font-weight:800;font-size:13px;padding:1px 10px;border-radius:99px;margin-bottom:6px}
.q{border:3px solid transparent}.q.ok{border-color:var(--ok);background:#f1fbf4}.q.no{border-color:#e9a29f;background:#fff5f4}
.fig{text-align:center;margin:6px 0}.fig svg{max-width:100%;height:auto}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;font-size:17px;padding:10px 12px;border:2px solid #cfd8e3;border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);font-family:inherit}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:#e8eef5;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--main)}
.opt.right{border-color:var(--ok);background:#e3f6ea}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fde8e7}.opt.wrong b{background:var(--bad);color:#fff}
.q.done .opt,.q.done .tfb,.q.done input{pointer-events:none}
.tf{display:flex;gap:8px;margin-top:6px}.tfb{flex:1;font-size:17px;font-weight:800;padding:10px;border:2px solid #cfd8e3;border-radius:12px;background:#fff;cursor:pointer;font-family:inherit}
.tfb.right{border-color:var(--ok);background:#e3f6ea}.tfb.wrong{border-color:var(--bad);background:#fde8e7}
.fillrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.fillrow input{flex:1;min-width:120px;font-size:19px;padding:10px 12px;border:2px solid #cfd8e3;border-radius:10px;font-family:inherit}
.unit{font-weight:700;color:var(--dark)}
.btn{border:0;background:var(--main);color:#fff;font-weight:800;font-size:17px;padding:11px 20px;border-radius:12px;cursor:pointer;font-family:inherit}
.btn.sm{font-size:15px;padding:9px 14px}.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:8px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.ex{margin-top:4px;font-weight:400;color:#394b5c;font-size:15.5px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15;font-size:.95em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.fr span:last-child{padding:0 4px}
sup{font-size:.7em}
#result{display:none;text-align:center}
#result h2{margin:0 0 4px;color:var(--dark)}
#result .big{font-size:44px;font-weight:900;color:var(--main)}
#result .wrongs{font-size:15px;color:#555;margin-top:6px}
#sendmsg{margin-top:8px;font-size:14px;color:#555}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:48px;opacity:0;pointer-events:none;z-index:20}
.pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop.go{animation:none}}
@media (max-width:420px){body{font-size:16px}.opt{font-size:16px}}
</style></head><body>

      var html='<span class="lab">'+esc(u.label)+'</span>';
      if(u.stem)html+='<p class="stem">'+u.stem+'</p>';
      if(u.fig)html+='<div class="fig" role="img" aria-label="'+esc(u.figlabel||'Hình minh họa')+'">'+u.fig+'</div>';
      if(u.type==='mc'){html+='<div class="opts">';u.options.forEach(function(o,i){html+='<button class="opt" data-i="'+i+'"><b>'+'ABCD'[i]+'</b><span>'+o+'</span></button>'});html+='</div>'}
      else if(u.type==='tf'){html+='<p class="stem" style="font-weight:500">'+u.text+'</p><div class="tf"><button class="tfb" data-v="1">Đúng</button><button class="tfb" data-v="0">Sai</button></div>'}
      else{html+='<div class="fillrow"><input type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="Nhập đáp án" aria-label="'+esc(u.label)+'">'+(u.unit?'<span class="unit">'+u.unit+'</span>':'')+'<button class="btn sm chk" disabled>Kiểm tra</button></div>'}
      html+='<div class="fb" id="fb_'+u.id+'"></div>';
      c.innerHTML=html;root.appendChild(c);
      if(u.type==='mc'){c.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){grade(u,parseInt(b.getAttribute('data-i'),10))})})}
      else if(u.type==='tf'){c.querySelectorAll('.tfb').forEach(function(b){b.addEventListener('click',function(){grade(u,b.getAttribute('data-v')==='1')})})}
      else{var inp=c.querySelector('input'),bt=c.querySelector('.chk');inp.addEventListener('input',function(){bt.disabled=!inp.value.trim()});inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&inp.value.trim())grade(u,inp.value)});bt.addEventListener('click',function(){grade(u,inp.value)})}
    });
  });
  $('tot').textContent='0/'+units.length;
}
function grade(u,val,auto){
  if(state[u.id]&&state[u.id].done)return;
  var ok;
  if(u.type==='mc')ok=(val===u.ans);else if(u.type==='tf')ok=(val===u.ans);else ok=(val!==null&&val!==undefined&&String(val).trim()!==''&&fillOk(val,u));
  if(auto)ok=false;
  state[u.id]={done:true,ok:ok,val:val};
  var c=$('c_'+u.id);c.classList.add('done',ok?'ok':'no');
  if(u.type==='mc'){c.querySelectorAll('.opt').forEach(function(b,i){if(i===u.ans)b.classList.add('right');else if(i===val&&!ok)b.classList.add('wrong')})}
  else if(u.type==='tf'){c.querySelectorAll('.tfb').forEach(function(b){var v=b.getAttribute('data-v')==='1';if(v===u.ans)b.classList.add('right');else if(v===val&&!ok)b.classList.add('wrong')})}
  else{var inp=c.querySelector('input');inp.readOnly=true;c.querySelector('.chk').disabled=true}
  var ans=u.type==='mc'?('Đáp án đúng: <b>'+'ABCD'[u.ans]+'</b>'):(u.type==='tf'?('Đáp án đúng: <b>'+(u.ans?'Đúng':'Sai')+'</b>'):('Đáp án đúng: <b>'+u.show+'</b>'+(u.unit?' '+u.unit:'')));
  var msg=auto?'Con chưa làm câu này.':(ok?PRAISE[(pi++)%PRAISE.length]:COMFORT[(ci++)%COMFORT.length]);
  var fb=$('fb_'+u.id);fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✔ ':'✘ ')+msg+(ok&&u.type!=='fill'?'':'<div>'+ans+'</div>')+(u.expl?'<div class="ex">'+u.expl+'</div>':'');
  if(!auto){sound(ok);if(ok)pop('⭐')}
  upd();
}
function upd(){var d=0;units.forEach(function(u){if(state[u.id]&&state[u.id].done)d++});$('pbi').style.width=(100*d/units.length)+'%';$('tot').textContent=d+'/'+units.length}
function lopDone(){return $('lop').value.trim()}
function setupRoster(){
  var lop=$('lop');
  if(LOP_LINK){lop.value=LOP_LINK;lop.readOnly=true;
    var done=false;var to=setTimeout(function(){done=true},5000);
    fetch(GAS_URL+'?action=roster&lop='+encodeURIComponent(LOP_LINK)).then(function(r){return r.json()}).then(function(d){
      clearTimeout(to);if(done)return;
      if(d&&d.ok&&d.names&&d.names.length){
        var sel=document.createElement('select');sel.id='namesel';
        var o0=document.createElement('option');o0.value='';o0.textContent='-- Chọn tên con --';sel.appendChild(o0);
        d.names.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});
        var oo=document.createElement('option');oo.value='__other';oo.textContent='Tên con không có trong danh sách';sel.appendChild(oo);
        var nm=$('hoten');nm.style.display='none';nm.parentNode.insertBefore(sel,nm);
        sel.addEventListener('change',function(){if(sel.value==='__other'){nm.style.display='';nm.value='';nm.focus()}else{nm.style.display='none';nm.value=sel.value}});
      }
    }).catch(function(){});
  }
}
function submit(){
  if(submitted)return;
  var nm=$('hoten').value.trim(),lp=$('lop').value.trim();
  if(!nm||!lp){alert('Con nhập Họ và tên và Lớp trước khi nộp bài nhé!');window.scrollTo({top:$('info').offsetTop-10,behavior:'smooth'});return}
  submitted=true;
  units.forEach(function(u){if(!(state[u.id]&&state[u.id].done))grade(u,null,true)});
  var sc=0,wr=[];units.forEach(function(u){if(state[u.id].ok)sc++;else wr.push(u.label)});
  var R=$('result');R.style.display='block';
  var t10=Math.round(sc/units.length*10*4)/4;
  R.innerHTML='<h2>Kết quả của '+esc(nm)+'</h2><div class="big">'+sc+'/'+units.length+'</div><div>Quy ra thang 10: <b>'+String(t10).replace('.',',')+'</b></div>'+(wr.length?'<div class="wrongs">Các câu cần xem lại: '+wr.join(', ')+'</div>':'<div class="wrongs">Con làm đúng hết, giỏi quá! 🎉</div>')+'<div id="sendmsg">Đang gửi điểm cho cô…</div><p><button class="btn" id="redo">Làm lại từ đầu</button></p>';
  R.scrollIntoView({behavior:'smooth'});
  if(sc===units.length){sound(true);pop('🎉')}
  var body={bai:BAI,hoten:nm,lop:lp,loplink:LOP_LINK,diem:sc,tongdiem:units.length,causai:wr.join(', ')};
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(){$('sendmsg').textContent='Đã gửi điểm cho cô rồi nhé!'}).catch(function(){$('sendmsg').textContent='Chưa gửi được điểm, con kiểm tra mạng và bấm nộp lại nhé.';submitted=false});
  $('redo').addEventListener('click',function(){state={};submitted=false;units=[];$('qs').innerHTML='';R.style.display='none';build();upd();window.scrollTo({top:0,behavior:'smooth'})});
}
$('snd').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';this.setAttribute('aria-label',muted?'Bật âm thanh':'Tắt âm thanh')});
$('sub').addEventListener('click',submit);
build();setupRoster();
window.__units=units;window.__state=function(){return state};
})();
</script></body></html>
