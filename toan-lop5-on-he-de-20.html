<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toán lớp 5 – Đề ôn số 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --main:#2f6fd6; --dark:#1f4fa3; --soft:#e6efff; --sky:#dff1fb;
  --sun:#ffb53d; --petal:#f26d85; --ink:#1f2f4a; --paper:#fffdf6; --line:#d3def2; --mute:#5a6f8f;
  --ok:#1f9d63; --ok-bg:#e2f7eb; --bad:#e04f4f; --bad-bg:#fdeaea;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.6;
  background:linear-gradient(180deg,#dff1fb 0,#eef5ff 420px,#f4f8ff 100%);}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.2;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
.hero{position:relative;margin:0 -14px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;min-height:230px}
.hero-title{position:absolute;left:0;right:0;top:4%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:#fff;color:var(--dark);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;box-shadow:0 3px 0 rgba(31,79,163,.2)}
.hero-title h1{font-size:clamp(34px,9vw,58px);color:#fff;font-weight:800;text-shadow:0 3px 0 var(--dark),0 6px 14px rgba(31,79,163,.4);margin-top:4px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px;box-shadow:0 6px 0 #c9d8f0;position:relative}
.info{display:grid;grid-template-columns:1fr 130px;gap:12px}
.info label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
.info input,.info select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.info input[readonly]{background:#eef3fb;color:#3b4d6b;font-weight:800}
#otherName{margin-top:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.section-h{display:flex;align-items:center;gap:12px;margin:34px 0 0}
.section-h .ico{flex:none;width:54px;height:54px}
.section-h h2{font-size:26px;color:var(--dark)}
.section-h p{margin:0;font-size:15px;color:var(--mute)}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.num{flex:none;min-width:38px;height:38px;padding:0 4px;border-radius:19px;background:var(--main);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;display:grid;place-items:center;box-shadow:0 3px 0 var(--dark)}
.q-head .t{font-weight:800;font-size:18px;padding-top:4px;min-width:0;overflow-wrap:anywhere}
.fig{display:block;max-width:100%;height:auto;margin:6px auto 12px}
.part{margin-top:14px}
.part+.part{border-top:2px dashed var(--line);padding-top:14px}
.pq{font-weight:800;margin:0 0 4px;display:flex;gap:8px}
.pq .lab{flex:none;color:#fff;background:var(--petal);border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:15px;margin-top:2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:9px;cursor:pointer;background:#fff;min-height:48px}
.opt b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--dark);display:grid;place-items:center;font-size:15px;margin-top:1px}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--main)}
.done .opt{cursor:default}
.done .opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong b{background:var(--bad);color:#fff}
.done .opt:not(.right):not(.wrong){opacity:.6}
.fb{display:none;margin-top:12px;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.55}
.done .fb{display:block;animation:pop .35s ease}
.fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb .hd{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px}
.fb.ok .hd{color:var(--ok)} .fb.bad .hd{color:var(--bad)}
.fb .ans{margin-top:2px}
.fb .sol{margin-top:6px;background:#fff;border-radius:10px;padding:8px 10px;border:1.5px dashed var(--line)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px;font-weight:800}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.spark{position:absolute;right:16px;top:8px;font-size:30px;pointer-events:none;animation:spark 1s ease forwards}
@keyframes spark{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-36px) scale(1.25);opacity:0}}
.bar{position:sticky;top:0;z-index:5;margin:0 -14px;background:rgba(255,253,246,.94);backdrop-filter:blur(4px);border-bottom:2px solid var(--line);padding:6px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px}
.bar .track{flex:1;height:10px;background:#e3ebf8;border-radius:999px;overflow:hidden}
.bar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--main),#5aa0ff);border-radius:999px;transition:width .3s}
.snd{border:2px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-size:18px;line-height:1;padding:3px 10px;cursor:pointer}
.submit-zone{text-align:center;margin-top:30px}
.btn{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:12px 38px;cursor:pointer;background:var(--sun);color:#5a3a00;box-shadow:0 6px 0 #d18a12}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d18a12}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.green{background:var(--main);color:#fff;box-shadow:0 6px 0 var(--dark);font-size:18px;padding:9px 28px}
#msg{color:var(--bad);font-weight:800;min-height:26px;margin:10px 0 0}
#result{display:none;text-align:center;background:linear-gradient(180deg,#fff8e1,#fffdf6);border-color:var(--sun);box-shadow:0 6px 0 #f0cf86}
#result.show{display:block}
#result .em{font-size:60px;line-height:1}
#result .sc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:46px;color:var(--dark);line-height:1.1}
#result .s10{font-weight:800;color:#b36b00}
#result table{margin:12px auto;border-collapse:collapse;font-size:15.5px}
#result td{padding:4px 12px;border-bottom:1px dashed var(--line);text-align:left}
#result td:last-child{text-align:right;font-weight:800}
.note{font-size:14.5px;color:var(--mute);margin:8px 0 0}
.cloud{animation:drift 30s linear infinite alternate}
.cloud.s{animation-duration:42s}
@keyframes drift{to{transform:translateX(46px)}}
.swirl{stroke-dasharray:14 10;animation:blow 3.5s linear infinite}
@keyframes blow{to{stroke-dashoffset:-96}}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fly.d1{animation-delay:-1.3s}.fly.d2{animation-delay:-2.6s}.fly.slow{animation-duration:6s}
@keyframes bob{50%{transform:translate(8px,-10px) rotate(4deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
.twinkle.d1{animation-delay:-.8s}.twinkle.d2{animation-delay:-1.6s}
@keyframes tw{50%{opacity:.3}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway.d1{animation-delay:-1.7s}.sway.d2{animation-delay:-3.4s}
@keyframes sway{50%{transform:rotate(3deg)}}
.drive{animation:drive 9s linear infinite}
.drive.slow{animation-duration:16s}
@keyframes drive{from{transform:translateX(-170px)}to{transform:translateX(900px)}}
.dash{stroke-dasharray:26 22;animation:dashm 1.6s linear infinite}
@keyframes dashm{to{stroke-dashoffset:-96}}
.bounce{animation:bnc 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bounce.d1{animation-delay:-.5s}.bounce.d2{animation-delay:-.9s}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.wave{animation:wv 6s ease-in-out infinite alternate}
.wave.d1{animation-delay:-2s}.wave.d2{animation-delay:-4s}
@keyframes wv{to{transform:translateX(-34px)}}
.spin{animation:sp 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{to{transform:rotate(360deg)}}
.puff{animation:pf 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff.d1{animation-delay:-1.1s}.puff.d2{animation-delay:-2.2s}
@keyframes pf{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(-26px,-46px) scale(1.5);opacity:0}}
@media (max-width:600px){
  body{font-size:16px}
  .info{grid-template-columns:1fr}
  .q-head .t{font-size:17px}
  .section-h h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .cloud,.swirl,.fly,.twinkle,.sway,.drive,.dash,.bounce,.wave,.spin,.puff,.spark,.done .fb{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>

<script>
(function(){
"use strict";
var GAS_URL="https://script.google.com/macros/s/AKfycby_OmwTYAGJ5BdCL-u2lTPFqYsBMLqLtmeFUTeQYF52w0Nk-H0KlrvoWjINA5K0js1lIw/exec";
var BAI="Ôn tập hè - Đề 20";
var SEC={A:{t:"I. Ôn tập bổ trợ",d:"Em đọc kĩ đề, chạm vào đáp án em chọn. Máy chấm ngay nhé!",i:'<svg class="ico" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="27" fill="#ffe2a8"/><path d="M10 18 q9 -5 17 0 v22 q-8 -5 -17 0z" fill="#fff" stroke="#2f6fd6" stroke-width="2.5" stroke-linejoin="round"/><path d="M44 18 q-9 -5 -17 0 v22 q8 -5 17 0z" fill="#fff" stroke="#2f6fd6" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 24 h9 M14 29 h9 M31 24 h9 M31 29 h9" stroke="#f26d85" stroke-width="2" stroke-linecap="round"/></svg>'},
         B:{t:"II. Toán tư duy – nâng cao",d:"Những bài này cần suy nghĩ thêm một chút. Cố lên nào!",i:'<svg class="ico" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="27" fill="#cfeaf6"/><path d="M27 11 a12 12 0 0 1 6 22 v4 h-12 v-4 a12 12 0 0 1 6 -22z" fill="#ffd66b" stroke="#b36b00" stroke-width="2.5" stroke-linejoin="round"/><rect x="21" y="40" width="12" height="5" rx="2" fill="#2f6fd6"/><path d="M23 24 l4 4 l4 -4" fill="none" stroke="#b36b00" stroke-width="2" stroke-linecap="round"/></svg>'}};
var DATA=[{"n": 1, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "Một ca nô đi xuôi dòng với vận tốc 36 km/giờ và đi ngược dòng với vận tốc 28 km/giờ. Tìm vận tốc của dòng nước.", "lab": "", "o": ["4 km/giờ", "5 km/giờ", "8 km/giờ", "2 km/giờ"], "a": 0, "e": "Vận tốc xuôi dòng = vận tốc ca nô + vận tốc dòng nước; vận tốc ngược dòng = vận tốc ca nô − vận tốc dòng nước. Hiệu hai vận tốc bằng 2 lần vận tốc dòng nước. Vận tốc dòng nước: (36 − 28) : 2 = 4 (km/giờ)."}]}, {"n": 2, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "Giá một mặt hàng được tăng thêm 20%, sau đó lại giảm 20% so với giá đã tăng. Hỏi giá cuối cùng bằng bao nhiêu phần trăm giá ban đầu?", "lab": "", "o": ["96%", "100%", "104%", "98%"], "a": 0, "e": "Coi giá ban đầu là 100. Sau khi tăng 20%: 100 × 120 : 100 = 120. Sau khi giảm 20% của 120: 120 × 80 : 100 = 96. Giá cuối cùng bằng 96% giá ban đầu."}]}, {"n": 3, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "Một hình hộp chữ nhật có thể tích 360 cm³, đáy là hình chữ nhật có chiều dài 12 cm và chiều rộng 6 cm. Tính chiều cao của hình hộp.", "lab": "", "o": ["2 cm", "3 cm", "9 cm", "5 cm"], "a": 3, "e": "Diện tích đáy: 12 × 6 = 72 (cm²). Chiều cao = thể tích : diện tích đáy = 360 : 72 = 5 (cm)."}]}, {"n": 4, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "8 người thợ làm xong một công việc trong 12 ngày. Hỏi nếu có 6 người thợ (năng suất mỗi người như nhau) thì làm xong công việc đó trong bao nhiêu ngày?", "lab": "", "o": ["16 ngày", "15 ngày", "8 ngày", "17 ngày"], "a": 0, "e": "Công việc cần 8 × 12 = 96 (công, tức số ngày làm của một người). 6 người làm xong trong: 96 : 6 = 16 (ngày)."}]}, {"n": 5, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "Điểm trung bình của 4 bài kiểm tra của bạn Tùng là 8,5 điểm. Sau bài kiểm tra thứ năm, điểm trung bình của cả 5 bài là 8,8 điểm. Hỏi bài kiểm tra thứ năm Tùng được bao nhiêu điểm?", "lab": "", "o": ["11 điểm", "7 điểm", "13 điểm", "10 điểm"], "a": 3, "e": "Tổng điểm 5 bài: 8,8 × 5 = 44 (điểm). Tổng điểm 4 bài đầu: 8,5 × 4 = 34 (điểm). Điểm bài thứ năm: 44 − 34 = 10 (điểm)."}]}, {"n": 6, "sec": "A", "stem": null, "svg": "", "parts": [{"q": "Tuổi mẹ gấp 3 lần tuổi con. Sau 12 năm nữa, tuổi mẹ gấp 2 lần tuổi con. Hỏi hiện nay con bao nhiêu tuổi?", "lab": "", "o": ["15 tuổi", "24 tuổi", "12 tuổi", "14 tuổi"], "a": 2, "e": "Hiện nay mẹ gấp 3 lần con nên hiệu số tuổi bằng 2 lần tuổi con. Sau 12 năm mẹ gấp 2 lần con nên hiệu số tuổi bằng đúng tuổi con lúc đó. Vậy tuổi con sau 12 năm bằng 2 lần tuổi con hiện nay, suy ra tuổi con hiện nay là 12 (tuổi). Thử: mẹ 36 tuổi; sau 12 năm mẹ 48, con 24, 48 = 2 × 24."}]}, {"n": 7, "sec": "B", "stem": null, "svg": "", "parts": [{"q": "Từ thành phố A đến thành phố B có 3 con đường, từ thành phố B đến thành phố C có 4 con đường. Hỏi có bao nhiêu cách đi từ A đến C, đi qua B?", "lab": "", "o": ["12 cách", "9 cách", "13 cách", "10 cách"], "a": 0, "e": "Mỗi cách chọn con đường từ A đến B kết hợp với mỗi cách chọn con đường từ B đến C. Số cách đi: 3 × 4 = 12 (cách)."}]}, {"n": 8, "sec": "B", "stem": null, "svg": "", "parts": [{"q": "Có 10 đội bóng thi đấu vòng tròn một lượt (mỗi đội đấu với mỗi đội khác đúng một trận). Hỏi có tất cả bao nhiêu trận đấu?", "lab": "", "o": ["45 trận", "39 trận", "49 trận", "51 trận"], "a": 0, "e": "Mỗi đội đấu 9 trận, 10 đội là 10 × 9 = 90 lượt, nhưng mỗi trận được đếm hai lần. Số trận: 90 : 2 = 45 (trận)."}]}, {"n": 9, "sec": "B", "stem": null, "svg": "", "parts": [{"q": "Tìm số nhỏ nhất có 4 chữ số khác nhau và chia hết cho 9.", "lab": "", "o": ["1126", "1026", "876", "513"], "a": 1, "e": "Số chia hết cho 9 khi tổng các chữ số chia hết cho 9. Số nhỏ nhất có 4 chữ số khác nhau bắt đầu 1 0 2 …: tổng 1 + 0 + 2 = 3, cần chữ số cuối là 6 để tổng bằng 9. Thử các số nhỏ hơn: 1 023, 1 024, 1 025 có tổng 6, 7, 8 nên không chia hết cho 9. Vậy số cần tìm là 1 026."}]}, {"n": 10, "sec": "B", "stem": null, "svg": "", "parts": [{"q": "Một khối lập phương cạnh 6 cm được sơn đỏ tất cả các mặt, rồi cắt thành các khối lập phương nhỏ cạnh 2 cm. Hỏi có bao nhiêu khối nhỏ có đúng 3 mặt được sơn đỏ?", "lab": "", "o": ["10 khối", "9 khối", "6 khối", "8 khối"], "a": 3, "e": "Cắt cạnh 6 cm thành các khối cạnh 2 cm được 3 × 3 × 3 = 27 khối. Khối có 3 mặt được sơn là khối nằm ở đỉnh của khối lớn. Khối lập phương có 8 đỉnh nên có 8 khối."}]}];
var LOP_LINK=new URLSearchParams(location.search).get("lop")||"";

function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var LET=["A","B","C","D"];
var PRAISE=["Đúng rồi! Giỏi quá!","Chính xác! Em làm tốt lắm!","Tuyệt vời! Cứ thế phát huy nhé!","Hoan hô! Đúng rồi!","Siêu quá! Em tính đúng rồi!","Rất đúng! Em thật cẩn thận!"];
var SOFT=["Chưa đúng, không sao đâu!","Gần đúng rồi, xem lời giải nhé!","Chưa chính xác, cùng xem lại nào!","Tiếc quá! Đọc lời giải để lần sau làm đúng nhé!"];
var pi=0,si=0;

/* ---- âm thanh (Web Audio, chỉ phát sau thao tác chạm) ---- */
var soundOn=true,AC=null;
function ctx(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,t0,dur,type,vol){
  var a=ctx();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;
  var s=a.currentTime+t0;
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+dur+0.05);
}
function playOk(){if(!soundOn)return;tone(880,0,0.14,"sine",0.22);tone(1320,0.13,0.2,"sine",0.22);}
function playBad(){if(!soundOn)return;tone(240,0,0.22,"triangle",0.16);tone(190,0.16,0.28,"triangle",0.14);}
$("sndBtn").addEventListener("click",function(){
  soundOn=!soundOn;this.textContent=soundOn?"🔊":"🔇";this.setAttribute("aria-pressed",soundOn?"true":"false");
  if(soundOn){ctx();playOk();}
});

/* ---- dựng giao diện ---- */
var PARTS=[];
function build(){
  var zone=$("zone");zone.innerHTML="";PARTS=[];var lastSec="";
  DATA.forEach(function(it){
    if(it.sec!==lastSec){
      lastSec=it.sec;
      var h=el("div","section-h",SEC[it.sec].i+'<div><h2>'+SEC[it.sec].t+'</h2><p>'+SEC[it.sec].d+'</p></div>');
      zone.appendChild(h);
    }
    var card=el("div","card q");card.id="b"+it.n;
    var multi=it.parts.length>1;
    var head=el("div","q-head",'<span class="num">'+it.n+'</span><span class="t"></span>');
    head.querySelector(".t").innerHTML=it.stem?it.stem:it.parts[0].q;
    card.appendChild(head);
    if(it.svg){var f=el("div",null,it.svg);card.appendChild(f);}
    it.parts.forEach(function(p,k){
      var rec={it:it,p:p,label:"Câu "+it.n+(p.lab||""),done:false,pick:-1,ok:false,sec:it.sec};
      var box=el("div","part");
      if(multi||it.stem){
        box.appendChild(el("p","pq",(p.lab?'<span class="lab">'+p.lab+'</span>':'')+'<span>'+p.q+'</span>'));
      }
      p.o.forEach(function(t,j){
        var b=el("button","opt",'<b>'+LET[j]+'</b><span>'+t+'</span>');b.type="button";
        b.addEventListener("click",function(){choose(rec,j);});
        box.appendChild(b);
      });
      var fb=el("div","fb");box.appendChild(fb);
      rec.box=box;rec.fb=fb;rec.card=card;
      card.appendChild(box);PARTS.push(rec);
    });
    zone.appendChild(card);
  });
  upd();
}
function upd(){
  var n=0;PARTS.forEach(function(r){if(r.done)n++;});
  $("barTxt").textContent="Đã chấm "+n+"/"+PARTS.length+" câu";
  $("barFill").style.width=(PARTS.length?n*100/PARTS.length:0)+"%";
}
function reveal(rec,pick,auto){
  rec.done=true;rec.pick=pick;rec.ok=(pick===rec.p.a);
  rec.box.classList.add("done");
  var opts=rec.box.querySelectorAll(".opt");
  opts.forEach(function(o,j){o.disabled=true;
    if(j===rec.p.a)o.classList.add("right");
    else if(j===pick)o.classList.add("wrong");});
  var head,cls;
  if(rec.ok){head=PRAISE[pi++%PRAISE.length];cls="ok";}
  else if(pick<0){head="Em chưa làm câu này";cls="bad";}
  else{head=SOFT[si++%SOFT.length];cls="bad";}
  rec.fb.className="fb "+cls;
  rec.fb.innerHTML='<div class="hd">'+(rec.ok?"✔ ":"✘ ")+head+'</div><div class="ans">Đáp án đúng: <b>'+LET[rec.p.a]+'.</b> '+rec.p.o[rec.p.a]+'</div><div class="sol"><b>Lời giải:</b> '+rec.p.e+'</div>';
  if(rec.ok&&!auto){
    var s=el("span","spark","✨");rec.box.style.position="relative";rec.box.appendChild(s);
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1100);
  }
  upd();
}
function choose(rec,j){
  if(rec.done)return;
  reveal(rec,j,false);
  if(rec.ok)playOk();else playBad();
}

/* ---- họ tên / lớp ---- */
function curName(){
  var sel=$("nameSel");
  if(sel.style.display!=="none"){
    if(sel.value==="__other")return $("otherName").value.trim();
    return sel.value;
  }
  return $("studentName").value.trim();
}
function initClass(){
  var cl=$("studentClass");
  if(LOP_LINK){
    cl.value=LOP_LINK;cl.readOnly=true;
    var done=false;
    function useRoster(d){
      if(done)return;done=true;
      if(d&&d.ok&&d.names&&d.names.length){
        var sel=$("nameSel");sel.innerHTML="";
        var o0=el("option",null,"-- Chọn tên của em --");o0.value="";sel.appendChild(o0);
        d.names.forEach(function(n){var o=el("option");o.value=n;o.textContent=n;sel.appendChild(o);});
        var oo=el("option",null,"Tên con không có trong danh sách");oo.value="__other";sel.appendChild(oo);
        $("studentName").style.display="none";sel.style.display="block";
        sel.addEventListener("change",function(){$("otherName").style.display=(sel.value==="__other")?"block":"none";});
      }
    }
    try{
      var ctl=("AbortController" in window)?new AbortController():null;
      var timer=setTimeout(function(){done=true;if(ctl)ctl.abort();},5000);
      fetch(GAS_URL+"?action=roster&lop="+encodeURIComponent(LOP_LINK),ctl?{signal:ctl.signal}:{})
        .then(function(r){return r.json();})
        .then(function(d){clearTimeout(timer);useRoster(d);})
        .catch(function(){clearTimeout(timer);done=true;});
    }catch(e){}
  }
}

/* ---- nộp bài ---- */
var graded=false,warned=false;
$("submitBtn").addEventListener("click",function(){
  if(graded)return;
  var nm=curName(),cl=$("studentClass").value.trim(),msg=$("msg");
  if(!nm||!cl){
    msg.textContent="Em hãy điền họ tên và lớp trước khi nộp bài nhé!";
    if(!nm){var t=($("nameSel").style.display!=="none")?($("nameSel").value==="__other"?$("otherName"):$("nameSel")):$("studentName");t.focus();}
    else $("studentClass").focus();
    return;
  }
  var blank=0;PARTS.forEach(function(r){if(!r.done)blank++;});
  if(blank>0&&!warned){warned=true;msg.textContent="Em còn "+blank+" câu chưa làm. Em kiểm tra lại nhé – nếu vẫn muốn nộp, hãy bấm “Nộp bài” lần nữa.";return;}
  msg.textContent="";graded=true;
  PARTS.forEach(function(r){if(!r.done)reveal(r,-1,true);});
  var earned=0,wrong=[],bySec={A:[0,0],B:[0,0]};
  PARTS.forEach(function(r){
    bySec[r.sec][1]++;
    if(r.ok){earned++;bySec[r.sec][0]++;}else wrong.push(r.label);
  });
  var total=PARTS.length;
  $("submitBtn").disabled=true;
  $("studentName").disabled=true;$("nameSel").disabled=true;$("otherName").disabled=true;$("studentClass").disabled=true;
  try{
    fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({bai:BAI,hoten:nm,lop:cl,loplink:LOP_LINK,diem:earned,tongdiem:total,causai:wrong.join(", ")})}).catch(function(){});
  }catch(e){}
  window.__sent={bai:BAI,hoten:nm,lop:cl,loplink:LOP_LINK,diem:earned,tongdiem:total,causai:wrong.join(", ")};
  var pct=earned/total,em,m;
  if(pct>=.9){em="🏆";m="Tuyệt vời! Em giải toán thật giỏi!";}
  else if(pct>=.7){em="🌟";m="Rất tốt! Em sắp đạt điểm tuyệt đối rồi đấy.";}
  else if(pct>=.5){em="👍";m="Khá lắm! Xem lại các ô đỏ để giỏi hơn nữa nhé.";}
  else{em="🌱";m="Đừng lo, đọc lời giải rồi thử lại, em sẽ làm tốt hơn!";}
  $("rEm").textContent=em;$("rSc").textContent=earned+" / "+total+" điểm";
  $("r10").textContent="Quy ra thang 10: "+(Math.round(pct*100)/10).toString().replace(".",",")+" điểm";
  $("rMsg").textContent=nm+" ơi, "+m;
  $("rTab").innerHTML="<tr><td>"+SEC.A.t+"</td><td>"+bySec.A[0]+" / "+bySec.A[1]+"</td></tr><tr><td>"+SEC.B.t+"</td><td>"+bySec.B[0]+" / "+bySec.B[1]+"</td></tr>";
  $("result").classList.add("show");$("result").scrollIntoView({behavior:"smooth",block:"center"});
});
$("retryBtn").addEventListener("click",function(){
  graded=false;warned=false;pi=0;si=0;
  $("submitBtn").disabled=false;$("msg").textContent="";
  $("studentName").disabled=false;$("nameSel").disabled=false;$("otherName").disabled=false;$("studentClass").disabled=false;
  $("result").classList.remove("show");
  build();window.scrollTo({top:0,behavior:"smooth"});
});
window.__parts=function(){return PARTS;};
build();initClass();
})();
</script>
