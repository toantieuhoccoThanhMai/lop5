<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toán lớp 5 – Ôn tập tháng 11 – Đề 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#2f8f5b; --leaf-dark:#1f6a42; --leaf-soft:#e3f5ea;
  --sky:#dff1fb; --sun:#ffb53d; --petal:#f26d85;
  --ink:#23402f; --paper:#fffdf6; --line:#d6e6d9;
  --ok:#1f9d63; --ok-bg:#e2f7eb; --bad:#e04f4f; --bad-bg:#fdeaea;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.6;
  background:linear-gradient(180deg,#dff1fb 0,#eef8ee 420px,#f4faef 100%);}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.2;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 80px}
.hero{position:relative;margin:0 -14px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero-title{position:absolute;left:0;right:0;top:4%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:#fff;color:var(--leaf-dark);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;box-shadow:0 3px 0 rgba(31,106,66,.18)}
.hero-title h1{font-size:clamp(34px,9vw,60px);color:#fff;font-weight:800;text-shadow:0 3px 0 var(--leaf-dark),0 6px 14px rgba(31,106,66,.35);margin-top:2px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px;box-shadow:0 6px 0 #cfe3d2}
.info{display:grid;grid-template-columns:1fr 130px;gap:12px}
.info label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
.info input,.info select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.info input[readonly]{background:#eef6ef;font-weight:800}
input:focus,select:focus,button:focus-visible,.opt:focus-visible,.pill:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.section-h{display:flex;align-items:center;gap:12px;margin:34px 0 0}
.section-h .ico{flex:none;width:54px;height:54px}
.section-h h2{font-size:26px;color:var(--leaf-dark)}
.section-h p{margin:0;font-size:15px;color:#557a63}
.q{position:relative}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.num{flex:none;min-width:38px;height:38px;padding:0 10px;border-radius:19px;background:var(--leaf);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 0 var(--leaf-dark);white-space:nowrap}
.q-head .t{font-weight:800;font-size:18px;padding-top:4px;min-width:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-size:.92em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 4px 1px}
.fr span:last-child{padding:1px 4px 0}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:6px auto 12px}
.note{font-size:14.5px;color:#557a63;margin:8px 0 0}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:9px;cursor:pointer;background:#fff;min-height:48px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-dark);display:grid;place-items:center;font-size:15px}
.opt:active{transform:translateY(1px)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong b{background:var(--bad);color:#fff}
.locked .opt,.locked .pill,.locked .nin{cursor:default}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:9px;background:#fff}
.prow .pre{font-weight:700;min-width:0}
.prow .unit,.prow .post{font-weight:700}
.nin{width:104px;font:inherit;font-weight:800;font-size:19px;padding:7px 10px;border:2px solid var(--leaf);border-radius:12px;background:var(--leaf-soft);color:var(--leaf-dark);text-align:center}
.nin:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.prow.right{border-color:var(--ok);background:var(--ok-bg)}
.prow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fix{display:none;font-weight:800;color:var(--ok);font-size:14.5px;white-space:normal}
.prow.wrong .fix{display:inline}
.pills{display:flex;gap:6px}
.pill{width:48px;height:44px;border:2px solid var(--leaf);border-radius:12px;background:var(--leaf-soft);color:var(--leaf-dark);font:inherit;font-weight:800;font-size:22px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--leaf);color:#fff}
.chain{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:8px}
.cstart{align-self:flex-start;background:#fff7dc;border:2px solid var(--sun);border-radius:14px;padding:6px 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px}
.cop{display:flex;align-items:center;gap:8px;color:#557a63;font-weight:800}
.cop .ar{width:28px;text-align:center;font-size:20px;color:var(--leaf)}
.cop .opb{background:#fff;border:2px dashed var(--leaf);border-radius:999px;padding:1px 14px;color:var(--leaf-dark)}
.sol{display:none;margin-top:12px;background:#fff6dd;border:2px dashed var(--sun);border-radius:14px;padding:10px 14px;font-size:16px}
.checked .sol{display:block}
.fb{display:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;margin-top:12px}
.checked .fb{display:block}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)} .fb.pt{color:#b36b00}
.chk{margin-top:12px;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:8px 26px;cursor:pointer;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-dark)}
.chk[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.checked .chk{display:none}
.score-tag{display:none;position:absolute;top:-13px;right:14px;font-weight:800;font-size:14px;border-radius:999px;padding:2px 12px;color:#fff}
.checked .score-tag{display:block}
.score-tag.full{background:var(--ok)} .score-tag.part{background:#e59a1c} .score-tag.zero{background:var(--bad)}
.q.ok-card{border-color:var(--ok)} .q.no-card{border-color:#eab3b3}
.group{background:#fff;border-style:dashed;box-shadow:none;padding:12px 16px}
.group h3{font-size:22px;color:var(--leaf-dark)}
.group p{margin:2px 0 0;font-weight:700}
.prog{position:fixed;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.55);z-index:20}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .35s}
.snd{position:fixed;right:10px;top:14px;z-index:21;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 #cfe3d2}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:30;pointer-events:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;color:#fff;background:var(--ok);border-radius:999px;padding:8px 26px;box-shadow:0 6px 0 var(--leaf-dark);animation:pop 1.1s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1;transform:translate(-50%,-10px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.submit-zone{text-align:center;margin-top:30px}
.btn{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:12px 38px;cursor:pointer;background:var(--sun);color:#5a3a00;box-shadow:0 6px 0 #d18a12}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d18a12}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-dark);font-size:18px;padding:9px 28px}
#msg{color:var(--bad);font-weight:800;min-height:26px;margin:10px 0 0}
#result{display:none;text-align:center;background:linear-gradient(180deg,#fff8e1,#fffdf6);border-color:var(--sun);box-shadow:0 6px 0 #f0cf86}
#result.show{display:block}
#result .em{font-size:60px;line-height:1}
#result .sc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:46px;color:var(--leaf-dark);line-height:1.1}
#result .s10{font-weight:800;color:#b36b00}
#result table{margin:12px auto;border-collapse:collapse;font-size:15.5px}
#result td{padding:4px 12px;border-bottom:1px dashed var(--line);text-align:left}
#result td:last-child{text-align:right;font-weight:800}
@media (max-width:600px){
  body{font-size:16px}
  .info{grid-template-columns:1fr}
  .hero-title h1{font-size:clamp(28px,8.5vw,44px)}
  .hero-title .wk{font-size:13px;padding:2px 12px}
  .section-h h2{font-size:21px}
  .nin{width:92px}
}
.cloud{animation:drift 30s linear infinite alternate}
.cloud.d2{animation-duration:38s;animation-delay:-8s}
.drive{animation:drive 11s linear infinite}
.sway{animation:sway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway.d2{animation-delay:-2s}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fly.d2{animation-delay:-1.6s}
@keyframes drift{to{transform:translateX(46px)}}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(1000px)}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes bob{50%{transform:translate(8px,-9px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.drive,.sway,.fly,.praise{animation:none}html{scroll-behavior:auto}.drive{transform:translateX(420px)}.praise{opacity:1}}

</style>
</head>
<body>
<button class="snd" id="sndBtn" type="button" aria-label="Tắt âm thanh" aria-pressed="true">🔊</button>
<div class="prog" aria-hidden="true"><i id="progBar"></i></div>
<div class="wrap">
<div class="hero">
<svg viewBox="0 0 820 400" role="img" aria-label="Tranh vẽ cánh đồng buổi sáng: thửa ruộng hình tam giác có đường cao nét đứt, chiếc ô tô chạy trên đường và chồng bao gạo bên đường">

    <radialGradient id="sunG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffc94d"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></radialGradient>

</div>

<div class="card info">
  <div><label for="studentName">Họ và tên của em</label><div id="nameBox"><input id="studentName" type="text" autocomplete="name" placeholder="Nhập họ và tên của em..."></div></div>
  <div><label for="studentClass">Lớp</label><input id="studentClass" type="text" placeholder="VD: 5A"></div>
</div>
<p class="note" style="margin:10px 4px 0">Em chạm vào đáp án (hoặc điền số rồi bấm “Kiểm tra câu này”): máy sẽ chấm ngay và cho em xem lời giải.</p>

  <div class="em" id="rEm"></div>
  <div class="sc" id="rSc"></div>

</div>
<script>
(function(){
"use strict";
var GAS_URL = "https://script.google.com/macros/s/AKfycby_OmwTYAGJ5BdCL-u2lTPFqYsBMLqLtmeFUTeQYF52w0Nk-H0KlrvoWjINA5K0js1lIw/exec";

var soundOn=true, actx=null;
function ctx(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
  return actx;
}
function tone(freq,t0,dur,type,vol){
  var c=ctx();if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+t0);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+0.05);
}
function sndOk(){if(!soundOn)return;tone(988,0,0.16,'sine',0.22);tone(1319,0.14,0.28,'sine',0.22);}
function sndNo(){if(!soundOn)return;tone(247,0,0.22,'triangle',0.16);tone(196,0.18,0.3,'triangle',0.14);}

  s=String(s==null?'':s).replace(/[\s ]/g,'').replace(',','.');

  var zone=$('zone');zone.innerHTML='';cards=[];
  DATA.sections.forEach(function(s){
    var h=el('div','section-h',(ICONS[s.icon]||'')+'<div><h2></h2><p></p></div>');
    h.querySelector('h2').textContent=s.title;h.querySelector('p').textContent=s.sub;zone.appendChild(h);
    s.items.forEach(function(it){
      if(it.type==='group'){
        var g=el('div','card group','<h3></h3><p></p>');g.querySelector('h3').textContent=it.heading;g.querySelector('p').textContent=it.prompt;zone.appendChild(g);return;
      }
      if(it.type==='mc')zone.appendChild(buildMC(it));
      else zone.appendChild(buildMulti(it));
    });
  });
  setProgress();
}

function addTail(node,c){
  var fb=el('div','fb');var sol=el('div','sol','<b>Lời giải:</b> '+c.def.sol);
  node.appendChild(fb);node.appendChild(sol);c.fb=fb;
}

function buildMC(d){
  var node=el('div','card q');
  node.appendChild(el('span','score-tag'));
  var head=el('div','q-head','<span class="num"></span><span class="t"></span>');
  head.querySelector('.num').textContent=d.label;head.querySelector('.t').innerHTML=d.prompt;
  node.appendChild(head);
  var c={node:node,def:d,graded:false,parts:[{label:d.label,max:1,earned:0}],opts:[]};
  d.options.forEach(function(t,j){
    var b=el('button','opt','<b>'+'ABCD'[j]+'</b><span></span>');b.type='button';
    b.querySelector('span').innerHTML=t;
    b.addEventListener('click',function(){if(!c.graded)gradeCard(c,false,j);});
    node.appendChild(b);c.opts.push(b);
  });
  addTail(node,c);cards.push(c);return node;
}

function buildMulti(d){
  var node=el('div','card q');
  node.appendChild(el('span','score-tag'));
  var head=el('div','q-head','<span class="num"></span><span class="t"></span>');
  head.querySelector('.num').textContent=d.heading;head.querySelector('.t').innerHTML=d.prompt;
  node.appendChild(head);
  var c={node:node,def:d,graded:false,parts:[],rows:[]};
  if(d.fig){var f=el('div',null,d.fig);node.appendChild(f.firstChild);}
  var holder=node;
  if(d.type==='chain'){
    var ch=el('div','chain');ch.appendChild(el('div','cstart',d.start));node.appendChild(ch);holder=ch;
  }
  d.parts.forEach(function(p,i){
    c.parts.push({label:p.label,max:1,earned:0});
    var row;
    if(d.type==='fill'){
      row=el('div','prow','<span class="pre"></span><input class="nin" type="text" inputmode="decimal" autocomplete="off" aria-label=""><span class="unit"></span><span class="post"></span><span class="fix"></span>');
      row.querySelector('.pre').innerHTML=p.pre||'';row.querySelector('.unit').textContent=p.unit||'';row.querySelector('.post').innerHTML=p.post||'';
      var inp=row.querySelector('input');inp.setAttribute('aria-label','Đáp án '+p.label);
      inp.addEventListener('input',function(){refreshBtn(c);});
      row.querySelector('.fix').textContent='Đúng: '+p.ans+(p.unit?' '+p.unit:'');
    }else if(d.type==='chain'){
      holder.appendChild(el('div','cop','<span class="ar">↓</span><span class="opb"></span>')).querySelector('.opb').textContent=d.ops[i];
      row=el('div','prow','<input class="nin" type="text" inputmode="decimal" autocomplete="off"><span class="fix"></span>');
      var inp2=row.querySelector('input');inp2.setAttribute('aria-label','Kết quả '+p.label);
      inp2.addEventListener('input',function(){refreshBtn(c);});
      row.querySelector('.fix').textContent='Đúng: '+p.ans;
    }else{ // cmp
      row=el('div','prow','<span class="pre"></span><span class="pills"></span><span class="post"></span><span class="fix"></span>');
      row.querySelector('.pre').innerHTML=p.left;row.querySelector('.post').innerHTML=p.right;
      var pills=row.querySelector('.pills');row._v='';
      ['>','<','='].forEach(function(sym){
        var b=el('button','pill',sym==='>'?'&gt;':(sym==='<'?'&lt;':'='));b.type='button';b.setAttribute('aria-pressed','false');
        b.setAttribute('aria-label',sym==='>'?'lớn hơn':(sym==='<'?'bé hơn':'bằng'));
        b.addEventListener('click',function(){
          if(c.graded)return;
          pills.querySelectorAll('.pill').forEach(function(x){x.setAttribute('aria-pressed','false');});
          b.setAttribute('aria-pressed','true');row._v=sym;refreshBtn(c);
        });
        pills.appendChild(b);
      });
      row.querySelector('.fix').textContent='Đúng: '+(p.ans==='>'?'>':(p.ans==='<'?'<':'='));
    }
    holder.appendChild(row);c.rows.push(row);
  });
  if(d.note){node.appendChild(el('p','note',d.note));}
  var btn=el('button','chk','Kiểm tra câu này');btn.type='button';btn.disabled=true;
  btn.addEventListener('click',function(){if(!c.graded)gradeCard(c,false);});
  node.appendChild(btn);c.btn=btn;
  addTail(node,c);cards.push(c);return node;
}

function hasInput(c){
  if(c.def.type==='cmp')return c.rows.some(function(r){return r._v;});
  return c.rows.some(function(r){return r.querySelector('input').value.trim()!=='';});
}
function refreshBtn(c){if(c.btn)c.btn.disabled=!hasInput(c);}

/* ---------- chấm ---------- */
function gradeCard(c,silent,pick){
  if(c.graded)return;
  c.graded=true;var d=c.def,e=0;
  if(d.type==='mc'){
    var ok=(pick===d.ans);c.parts[0].earned=ok?1:0;e=c.parts[0].earned;
    c.opts.forEach(function(b,j){
      if(j===d.ans)b.classList.add('right');else if(j===pick)b.classList.add('wrong');
      b.disabled=true;
    });
  }else{
    d.parts.forEach(function(p,i){
      var row=c.rows[i],ok;
      if(d.type==='cmp')ok=(row._v===p.ans);
      else ok=sameNum(row.querySelector('input').value,p.ans);
      c.parts[i].earned=ok?1:0;e+=c.parts[i].earned;
      row.classList.add(ok?'right':'wrong');
      row.querySelectorAll('input,button').forEach(function(x){x.disabled=true;});
    });
  }
  var t=c.parts.length;
  c.node.classList.add('checked','locked');
  c.node.classList.add(e===t?'ok-card':'no-card');
  var tag=c.node.querySelector('.score-tag');tag.textContent=e+' / '+t+' điểm';tag.className='score-tag '+(e===t?'full':(e===0?'zero':'part'));
  if(e===t){c.fb.className='fb ok';c.fb.textContent='✅ Đúng rồi! '+nextPraise();}
  else if(e===0){c.fb.className='fb no';c.fb.textContent='❌ '+nextCheer();}
  else{c.fb.className='fb pt';c.fb.textContent='👍 Đúng '+e+'/'+t+' ý. Em xem các ý đỏ nhé.';}
  if(!silent){
    if(e===t){sndOk();popPraise(PRAISE[(pi+PRAISE.length-1)%PRAISE.length]);}else{sndNo();}
    if(c.btn)c.btn.disabled=true;
  }
  setProgress();
}

/* ---------- họ tên / lớp ---------- */
var rosterMode=false;
function getName(){
  if(rosterMode){
    var s=$('nameSel');
    if(s&&s.value&&s.value!=='__other')return s.value;
    return ($('nameOther').value||'').trim();
  }
  return ($('studentName').value||'').trim();
}
function initClass(){
  var cl=$('studentClass');
  if(LOP_LINK){cl.value=LOP_LINK;cl.readOnly=true;loadRoster();}
}
function loadRoster(){
  var done=false;
  var timer=setTimeout(function(){done=true;},5000);
  try{
    fetch(GAS_URL+'?action=roster&lop='+encodeURIComponent(LOP_LINK)).then(function(r){return r.json();}).then(function(d){
      clearTimeout(timer);
      if(done||!d||!d.ok||!d.names||!d.names.length||graded)return;
      var box=$('nameBox');box.innerHTML='';
      var sel=el('select',null,'<option value="">— Em chọn tên của mình —</option>');sel.id='nameSel';sel.setAttribute('aria-label','Chọn tên của em');
      d.names.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
      var oo=document.createElement('option');oo.value='__other';oo.textContent='Tên con không có trong danh sách';sel.appendChild(oo);
      var other=el('input');other.type='text';other.id='nameOther';other.placeholder='Nhập họ và tên của em...';other.style.display='none';other.style.marginTop='8px';
      sel.addEventListener('change',function(){other.style.display=sel.value==='__other'?'block':'none';});
      box.appendChild(sel);box.appendChild(other);rosterMode=true;
    }).catch(function(){clearTimeout(timer);});
  }catch(e){clearTimeout(timer);}
}

/* ---------- nộp bài ---------- */
function countBlank(){
  var n=0;
  cards.forEach(function(c){if(c.graded)return;
    if(c.def.type==='mc'){n+=c.parts.length;}
    else c.rows.forEach(function(r){
      if(c.def.type==='cmp'){if(!r._v)n++;}else if(r.querySelector('input').value.trim()==='')n++;
    });
  });
  return n;
}
$('submitBtn').addEventListener('click',function(){
  if(graded)return;
  var nm=getName(),cl=$('studentClass'),msg=$('msg');
  var nameEl=rosterMode?($('nameSel').value==='__other'?$('nameOther'):$('nameSel')):$('studentName');
  if(!nm||!cl.value.trim()){
    msg.textContent='Em hãy điền họ tên và lớp trước khi nộp bài nhé!';
    nameEl.style.borderColor=nm?'':'#e04f4f';cl.style.borderColor=cl.value.trim()?'':'#e04f4f';
    (nm?cl:nameEl).focus();return;
  }
  nameEl.style.borderColor='';cl.style.borderColor='';
  var blank=countBlank();
  if(blank>0&&!warned){warned=true;msg.textContent='Em còn '+blank+' chỗ chưa làm. Em kiểm tra lại nhé – nếu vẫn muốn nộp, hãy bấm “Nộp bài” lần nữa.';return;}
  msg.textContent='';graded=true;
  cards.forEach(function(c){gradeCard(c,true,-1);});
  var earned=0,total=0,wrong=[],rows=[];
  cards.forEach(function(c){
    var e=0;c.parts.forEach(function(p){earned+=p.earned;total+=p.max;e+=p.earned;if(p.earned<p.max)wrong.push(p.label);});
    rows.push([c.def.type==='mc'?c.def.label:c.def.heading,e,c.parts.length]);
  });
  $('submitBtn').disabled=true;
  document.querySelectorAll('#studentName,#studentClass,#nameSel,#nameOther').forEach(function(x){x.disabled=true;});
  try{
    fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({bai:BAI,hoten:nm,lop:cl.value.trim(),loplink:LOP_LINK,diem:earned,tongdiem:total,causai:wrong.join(', ')})}).catch(function(){});
  }catch(e){}
  var pct=earned/total,em,m;
  if(pct>=.9){em='🏆';m='Tuyệt vời! Em làm bài rất xuất sắc!';}
  else if(pct>=.7){em='🌟';m='Rất tốt! Em xem lại các ô đỏ để hoàn hảo hơn nhé.';}
  else if(pct>=.5){em='👍';m='Khá lắm! Em xem lại lời giải ở các ô đỏ nhé.';}
  else{em='🌱';m='Đừng lo, em đọc lại lời giải rồi thử làm lại, em sẽ tiến bộ!';}
  $('rEm').textContent=em;$('rSc').textContent=earned+' / '+total+' điểm';
  $('r10').textContent='Quy ra thang 10: '+(Math.round(pct*40)/4).toString().replace('.',',')+' điểm';
  $('rMsg').textContent=nm+' ơi, '+m;
  $('rTab').innerHTML=rows.map(function(p){return '<tr><td>'+p[0]+'</td><td>'+p[1]+' / '+p[2]+'</td></tr>';}).join('');
  $('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'center'});
});
$('retryBtn').addEventListener('click',function(){
  graded=false;warned=false;$('submitBtn').disabled=false;$('msg').textContent='';
  $('result').classList.remove('show');
  var sn=$('studentName');if(sn){sn.value='';sn.disabled=false;}
  var ss=$('nameSel');if(ss){ss.value='';ss.disabled=false;}
  var so=$('nameOther');if(so){so.value='';so.disabled=false;so.style.display='none';}
  var cl=$('studentClass');cl.disabled=false;if(!LOP_LINK)cl.value='';
  build();window.scrollTo({top:0,behavior:'smooth'});
});

initClass();
build();

})();
</script>
</body>
